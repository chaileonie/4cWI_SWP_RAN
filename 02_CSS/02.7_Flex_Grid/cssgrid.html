<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            background-color: aliceblue;
            padding: 10px;
        }

        .container {
            display: grid;
            grid-template-columns: 33% 33% 33%;
            grid-auto-rows: minmax(100px), auto;
            column-gap: 1px;
            row-gap: 1px;
            ;
        }

        .grid-item-1:hover {
            position: relative;
            background-color: aqua;
        }

        .grid-item-2 {
            grid-column: span 2;
        }

        .item1 {
            grid-row-start: span 3;
        }

        .item2 {
            grid-column: span 2;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box item1">eins</div>
        <div class="box item2">zwei</div>
        <div class="box item3">drei</div>
        <div class="box item4">vier</div>
        <div class="box item5">Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolorem odio laboriosam rem, qui
            aut iure in deleniti blanditiis sapiente, architecto quia molestias minima saepe non ad corrupti dolore et
            quod!</div>
    </div>
</body>

</html>
